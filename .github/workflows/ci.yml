name: uv z/OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate buildenv syntax
        run: bash -n buildenv
      - name: Check patch files exist
        run: |
          test -f patches/mio/mio-1.2.2-zos.patch
          test -f patches/socket2/socket2-0.6.5-zos.patch
          test -f patches/rustix/rustix-1.1.4-zos.patch
          test -f patches/getrandom-02/getrandom-0.2.17-zos.patch
          test -f patches/getrandom-04/getrandom-0.4.3-zos.patch
          test -f patches/tokio/tokio-1.53.1-zos.patch
          test -f patches/fs2/fs2-0.4.3-zos.patch
          echo "All patch files present"
